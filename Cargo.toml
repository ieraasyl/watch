[package]
name = "watch-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Browse and resume your local media library from the terminal"
license = "MIT"

[[bin]]
name = "watch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3"
directories = "6"
nucleo-matcher = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
regex = "1"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.2"
walkdir = "2"
