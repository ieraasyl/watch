[package]
name = "watch-cli"
version = "0.1.0"
edition = "2021"
description = "Browse and resume your local media library from the terminal"
license = "MIT"

[[bin]]
name = "watch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3"
directories = "6"
nucleo-matcher = "0.3"
ratatui = "0.29"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
walkdir = "2"
