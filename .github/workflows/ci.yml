name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, '1.89.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.toolchain == 'stable' && 'rustfmt, clippy' || '' }}
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --check
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Install mpv
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Verify real mpv playback
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        run: cargo test --locked real_mpv -- --ignored
