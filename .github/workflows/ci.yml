name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Install mpv on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Install mpv on macOS
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Verify real mpv playback
        timeout-minutes: 5
        run: cargo test --locked real_mpv -- --ignored
