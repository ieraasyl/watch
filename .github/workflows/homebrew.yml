name: Homebrew formula

on:
  pull_request:
    paths:
      - .github/workflows/homebrew.yml
      - packaging/homebrew/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v0.4.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.render.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the formula from the release checksums
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # Pull requests check the formula against the latest published release.
          tag=${INPUT_TAG:-$(gh release view --json tagName --jq .tagName)}
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags look like v1.2.3, not $tag"
            exit 1
          fi
          state=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '"\(.draft) \(.prerelease) \(.immutable)"')
          if [[ "$state" != "false false "* ]]; then
            echo "$tag must be a published release, not a draft or prerelease."
            exit 1
          fi
          # The formula pins checksums, so only publish releases whose assets cannot change.
          if [[ "$EVENT" != pull_request && "$state" != *" true" ]]; then
            echo "$tag is not an immutable release, so its assets could change under the formula."
            exit 1
          fi
          gh release download --pattern SHA256SUMS --dir "$RUNNER_TEMP" -- "$tag"
          mkdir -p formula
          packaging/homebrew/render-formula.sh "${tag#v}" "$RUNNER_TEMP/SHA256SUMS" > formula/wvd.rb
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: formula/wvd.rb
          if-no-files-found: error
          # Re-running all jobs uploads again in the same run.
          overwrite: true

  test:
    name: Test on ${{ matrix.platform }}
    needs: render
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: formula
          path: ${{ runner.temp }}/formula
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        env:
          # Homebrew/install at a fixed commit, for runner images that ship without Homebrew.
          INSTALLER: https://raw.githubusercontent.com/Homebrew/install/e09ddecb4d4f4a3e776c00c62e010276133d1eed/install.sh
        run: |
          prefix=/home/linuxbrew/.linuxbrew
          if [[ ! -x "$prefix/bin/brew" ]]; then
            curl -fsSL "$INSTALLER" -o "$RUNNER_TEMP/install-homebrew.sh"
            NONINTERACTIVE=1 bash "$RUNNER_TEMP/install-homebrew.sh"
          fi
          printf '%s\n' "$prefix/bin" "$prefix/sbin" >> "$GITHUB_PATH"
      - name: Install, test, and audit the formula
        run: |
          brew tap-new --no-git local/wvd
          cp "$RUNNER_TEMP/formula/wvd.rb" "$(brew --repository local/wvd)/Formula/wvd.rb"
          brew install --formula local/wvd/wvd
          brew test local/wvd/wvd
          brew audit --strict --formula local/wvd/wvd

  publish:
    needs: [render, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # The environment only admits main and release tags, so unreviewed branches never get the key.
    environment: release
    concurrency:
      group: homebrew-publish
      cancel-in-progress: false
      # Keep every waiting publish instead of only the newest one.
      queue: max
    outputs:
      tap-commit: ${{ steps.publish.outputs.commit }}
    env:
      VERSION: ${{ needs.render.outputs.version }}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: formula
          path: ${{ runner.temp }}/formula
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ieraasyl/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Publish the formula to the tap
        id: publish
        working-directory: tap
        run: |
          if [[ -e Formula/wvd.rb ]]; then
            # All four platform URLs must be release URLs for one version, or the current
            # version is unknown and could be newer than this one.
            urls=$(grep -E '^[[:space:]]*url ' Formula/wvd.rb || true)
            pattern='^[[:space:]]*url "https://github\.com/ieraasyl/wvd/releases/download/v([0-9]+\.[0-9]+\.[0-9]+)/wvd-(macos|linux)-(arm64|x86_64)\.tar\.gz"$'
            matching=$(grep -cE "$pattern" <<< "$urls" || true)
            versions=$(sed -nE "s#$pattern#\\1#p" <<< "$urls" | sort -u)
            if [[ $(grep -c . <<< "$urls") -ne 4 || "$matching" -ne 4 || -z "$versions" || "$versions" == *$'\n'* ]]; then
              echo "Could not read one version from the tap's formula URLs:"
              printf '%s\n' "${urls:-none}"
              exit 1
            fi
            newest=$(printf '%s\n' "$versions" "$VERSION" | sort -V | tail -n 1)
            if [[ "$versions" != "$VERSION" && "$newest" == "$versions" ]]; then
              echo "The tap has wvd $versions, which is newer than $VERSION."
              exit 1
            fi
          fi
          mkdir -p Formula
          cp "$RUNNER_TEMP/formula/wvd.rb" Formula/wvd.rb
          git add Formula/wvd.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula for wvd $VERSION."
            printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "wvd $VERSION"
          git push origin HEAD
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: publish
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      TAP_COMMIT: ${{ needs.publish.outputs.tap-commit }}
    steps:
      - name: Install from the published tap
        run: |
          brew tap ieraasyl/tap
          # Test the commit this run published, even if a later release has moved the tap on.
          git -C "$(brew --repository ieraasyl/tap)" -c advice.detachedHead=false checkout "$TAP_COMMIT"
          brew install --formula ieraasyl/tap/wvd
          brew test ieraasyl/tap/wvd
